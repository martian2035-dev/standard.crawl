name: 离线测试
on:
  push:
    branches: [main]
    paths: ['**.py', '**.sh', '**.txt', '.github/workflows/**', '.cnb.yml']
  pull_request:
    paths: ['**.py', '**.sh', '**.txt', '.github/workflows/**', '.cnb.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-audit.txt pytest
      - run: python -m pytest -q
