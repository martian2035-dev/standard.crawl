name: Monthly standards collection

on:
  schedule:
    # 19:43 UTC on day 1 = 03:43 Asia/Shanghai on day 2.
    - cron: '43 19 1 * *'
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Campaign YYYY-MM; empty uses the current Asia/Shanghai month; same month resumes'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: monthly-standard-crawl
  cancel-in-progress: false

jobs:
  crawl:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      CAMPAIGN: ${{ inputs.campaign }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audit.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-audit.txt
      - name: Collect one chunk and preserve the cursor on failure
        id: crawl
        run: python scripts/github_monthly.py crawl --budget-seconds 3600 --delay 1
      - name: Save CSV files and cursors, including partial progress on failure
        if: always() && steps.crawl.outcome != 'skipped'
        run: bash scripts/github_commit.sh 国家公开标准信息.csv 行业公开标准信息.csv 地方公开标准信息.csv .github_crawl_state
      - name: Upload progress for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crawl-progress-${{ github.run_id }}-${{ github.run_attempt }}
          path: .github_crawl_state/
          include-hidden-files: true
          retention-days: 7
      - name: Build and verify the database after collection completes
        if: steps.crawl.outputs.next == 'build'
        env:
          CAMPAIGN: ${{ steps.crawl.outputs.campaign }}
        run: python scripts/github_monthly.py database
      - name: Publish the monthly database and CSV files
        if: steps.crawl.outputs.next == 'build'
        env:
          CAMPAIGN: ${{ steps.crawl.outputs.campaign }}
        run: |
          tag="standards-${CAMPAIGN}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$(git rev-parse HEAD)" --title "Standards database ${CAMPAIGN}" --notes 'Monthly standards lists, compressed SQLite database and integrity manifest. Extract the database and run build_db.py --verify to check it.'
          # GitHub keeps only ASCII characters in asset names, so the three Chinese file names would all
          # collapse to "default.csv" and collide. Upload copies with ASCII names instead.
          cp 国家公开标准信息.csv .github_release/national-standards.csv
          cp 行业公开标准信息.csv .github_release/industry-standards.csv
          cp 地方公开标准信息.csv .github_release/local-standards.csv
          gh release upload "$tag" .github_release/standards.db.gz .github_release/manifest.json \
            .github_release/national-standards.csv .github_release/industry-standards.csv .github_release/local-standards.csv --clobber
      - name: Start the next chunk
        if: steps.crawl.outputs.next == 'crawl'
        env:
          CAMPAIGN: ${{ steps.crawl.outputs.campaign }}
        run: gh workflow run monthly-crawl.yml --ref main -f "campaign=${CAMPAIGN}"
