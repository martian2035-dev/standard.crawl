name: 每月联网核验统计表

on:
  schedule:
    # UTC 每月 4 日 20:17，即北京时间每月 5 日 04:17。
    - cron: '17 20 4 * *'
  workflow_dispatch:
    inputs:
      campaign:
        description: '月份 YYYY-MM；留空为北京时间本月'
        type: string
        default: ''
      restore_run_id:
        description: '续跑所用的前片 Actions 运行 ID；留空开始新的全表核验'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: monthly-standard-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      CAMPAIGN: ${{ inputs.campaign }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audit.txt
      - name: 安装依赖
        run: python -m pip install -r requirements.txt -r requirements-audit.txt
      - name: 恢复前一片检查点；附件缺失时立即失败
        if: inputs.restore_run_id != '' && inputs.restore_run_id != null
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.restore_run_id }}
          name: audit-checkpoint
          path: .github_audit_work/
      - name: 官方网站逐项检索并核实状态、日期和替代版本
        id: audit
        run: |
          args=()
          if [[ -n "$RESTORE_RUN_ID" ]]; then args+=(--restore); fi
          python scripts/github_monthly.py audit --budget-seconds 3600 --delay 5 "${args[@]}"
      - name: 保存检查点（续片必须等上传成功）
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: audit-checkpoint
          path: .github_audit_work/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: 回写补充表和摘要
        if: steps.audit.outputs.next == 'done'
        run: bash scripts/github_commit.sh reports/标准信息统计表_已核验.xlsx reports/标准信息核验结果.csv reports/核验摘要.json
      - name: 发布当月补充表和网页证据
        if: steps.audit.outputs.next == 'done'
        env:
          CAMPAIGN: ${{ steps.audit.outputs.campaign }}
        run: |
          tag="audit-${CAMPAIGN}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$(git rev-parse HEAD)" --title "统计表核验 ${CAMPAIGN}" --notes '原表副本追加核验状态、发布日期、实施日期、现行替代版本与网页来源。未确认和未覆盖项保留待复核，不把查询失败视为废止。'
          gh release upload "$tag" reports/标准信息统计表_已核验.xlsx reports/标准信息核验结果.csv reports/核验摘要.json .github_release/核验证据.tar.gz --clobber
      - name: 自动启动下一片
        if: steps.audit.outputs.next == 'continue'
        env:
          CAMPAIGN: ${{ steps.audit.outputs.campaign }}
        run: gh workflow run monthly-audit.yml --ref main -f "campaign=${CAMPAIGN}" -f "restore_run_id=${GITHUB_RUN_ID}"
