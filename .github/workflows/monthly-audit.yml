name: Monthly standards audit

on:
  schedule:
    # 20:17 UTC on day 4 = 04:17 Asia/Shanghai on day 5.
    - cron: '17 20 4 * *'
  workflow_dispatch:
    inputs:
      campaign:
        description: 'Campaign YYYY-MM; empty uses the current Asia/Shanghai month'
        type: string
        default: ''
      restore_run_id:
        description: 'Previous Actions run ID to resume; empty starts a new full audit'
        type: string
        default: ''

permissions:
  contents: write
  actions: write

concurrency:
  group: monthly-standard-audit
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TZ: Asia/Shanghai
      PYTHONUNBUFFERED: '1'
      GH_TOKEN: ${{ github.token }}
      CAMPAIGN: ${{ inputs.campaign }}
      RESTORE_RUN_ID: ${{ inputs.restore_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-audit.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-audit.txt
      - name: Restore the previous checkpoint; fail if missing
        if: inputs.restore_run_id != '' && inputs.restore_run_id != null
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.restore_run_id }}
          name: audit-checkpoint
          path: .github_audit_work/
      - name: Verify status, dates and replacements against official sources
        id: audit
        run: |
          args=()
          if [[ -n "$RESTORE_RUN_ID" ]]; then args+=(--restore); fi
          python scripts/github_monthly.py audit --budget-seconds 3600 --delay 5 "${args[@]}"
      - name: Save the checkpoint before continuing
        if: always() && steps.audit.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: audit-checkpoint
          path: .github_audit_work/
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Commit audited workbook and summary
        if: steps.audit.outputs.next == 'done'
        run: bash scripts/github_commit.sh reports/standards-audited.xlsx reports/audit-results.csv reports/audit-summary.json
      - name: Publish the monthly audited workbook and evidence
        if: steps.audit.outputs.next == 'done'
        env:
          CAMPAIGN: ${{ steps.audit.outputs.campaign }}
        run: |
          tag="audit-${CAMPAIGN}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$(git rev-parse HEAD)" --title "Standards audit ${CAMPAIGN}" --notes 'Audit of the public query list covering status, publication and implementation dates, current replacements and source URLs. Unconfirmed and unsupported entries remain open for review; failed queries do not imply withdrawal.'
          gh release upload "$tag" reports/standards-audited.xlsx reports/audit-results.csv reports/audit-summary.json .github_release/audit-evidence.tar.gz --clobber
      - name: Start the next chunk
        if: steps.audit.outputs.next == 'continue'
        env:
          CAMPAIGN: ${{ steps.audit.outputs.campaign }}
        run: gh workflow run monthly-audit.yml --ref main -f "campaign=${CAMPAIGN}" -f "restore_run_id=${GITHUB_RUN_ID}"
